# Shared analyzer settings. Each package includes this file next to its own
# lint set (package:lints or package:flutter_lints).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat these as hard errors: they hide bugs or leak resources.
    unawaited_futures: error
    avoid_dynamic_calls: error
    cancel_subscriptions: error
    close_sinks: error
    avoid_print: error
    secure_pubspec_urls: error
  exclude:
    - "**/*.g.dart"
    - "**/build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - secure_pubspec_urls
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
