name: mail_protocol
description: >-
  Pure Dart implementation of the mail protocols used by the app: MIME
  (RFC 5322, 2045-2049), IMAP (RFC 3501/9051 with IDLE, CONDSTORE, QRESYNC)
  and SMTP submission (RFC 5321/6409). No Flutter dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

# No runtime dependencies on purpose: the protocol stack is written from
# scratch so every byte that reaches a mail server is code we own.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
