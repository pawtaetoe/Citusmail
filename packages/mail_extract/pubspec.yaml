name: mail_extract
description: >-
  Reads the schema.org data that shops, carriers and travel companies embed
  in their emails (JSON-LD and microdata, the markup mail apps use for
  cards): parcel deliveries and orders, and later reservations. Never runs
  anything from the mail. Pure Dart.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  html: ^0.15.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
