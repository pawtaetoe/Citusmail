name: mail_setup
description: >-
  Account setup: finds mail server settings from an email address (provider
  settings files, DNS, probing, optional Mozilla database) and verifies them
  with a real login before anything is saved. Pure Dart.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  mail_protocol: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
