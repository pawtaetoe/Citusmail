name: mail_pairing
description: >-
  Moves the user's mail accounts from one of their devices to another over
  the local network, after scanning a QR code: a one-time, end-to-end
  encrypted connection (X25519, HKDF-SHA256, ChaCha20-Poly1305). No server
  in between. Pure Dart.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.6
  mail_appsync: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
