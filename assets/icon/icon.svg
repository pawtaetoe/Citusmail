<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Citusmail app icon: a forward-leaning envelope ("citus" is Latin for
     fast) with a citrus flap, on a flat lagoon tile, in the app's own
     colours (CitusPalette: lagoon #0F7A69, citrus #F4B740). The fold is a
     gap, not a line, so the envelope also reads in one colour (Android's
     themed icon). tool/make_icons.py draws the same shapes. -->
  <defs>
    <clipPath id="envelope">
      <rect x="140" y="156" width="232" height="200" rx="30"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0F7A69"/>
  <!-- skewX(-14deg) about the middle (y = 256) -->
  <g transform="matrix(1 0 -0.2493 1 63.82 0)" clip-path="url(#envelope)">
    <path d="M100 100H412V127L256 249L100 127Z" fill="#F4B740"/>
    <path d="M100 165L256 287L412 165V400H100Z" fill="#FFFFFF"/>
  </g>
</svg>
