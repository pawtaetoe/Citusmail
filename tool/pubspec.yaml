name: repo_tools
description: Repository checks run in CI (dependency policy). Never shipped.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

executables:
  check_dependencies:
  generate_charset_tables:
  live_check:

dependencies:
  mail_protocol: any
  crypto: any
  mail_oauth: any
  mail_setup: any
  mail_sort: any
  mail_store: any
  mail_sync: any
  mail_trust: any
  mail_web: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
