name: fmail
description: A free, open source, privacy-first mail client.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.6
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  mail_compose: any
  mail_protocol: any
  mail_setup: any
  mail_sort: any
  mail_store: any
  mail_sync: any
  mail_trust: any
  mail_unsubscribe: any
  mail_view: any
  mail_web: any
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
