name: fmail
description: A free, open source, privacy-first mail client.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mail_protocol: any
  mail_setup: any
  mail_sort: any
  mail_store: any
  mail_sync: any
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
