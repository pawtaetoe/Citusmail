name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.1.0) also publishes a release with the packages.
    tags: ["v*"]
  pull_request:

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy, format, analyze, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies (lock file must match)
        run: flutter pub get --enforce-lockfile
      - name: Dependency policy
        run: dart run repo_tools:check_dependencies
      - name: No network libraries in shipped code
        run: dart run repo_tools:check_imports
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Test mail_protocol
        working-directory: packages/mail_protocol
        run: dart test
      - name: Test mail_store
        working-directory: packages/mail_store
        run: dart test
      - name: Test mail_sync
        working-directory: packages/mail_sync
        run: dart test
      - name: Test mail_setup
        working-directory: packages/mail_setup
        run: dart test
      - name: Test mail_sort
        working-directory: packages/mail_sort
        run: dart test
      - name: Test mail_view
        working-directory: packages/mail_view
        run: dart test
      - name: Test mail_compose
        working-directory: packages/mail_compose
        run: dart test
      - name: Test mail_trust
        working-directory: packages/mail_trust
        run: dart test
      - name: Test mail_web
        working-directory: packages/mail_web
        run: dart test
      - name: Test mail_appsync
        working-directory: packages/mail_appsync
        run: dart test
      - name: Test mail_unsubscribe
        working-directory: packages/mail_unsubscribe
        run: dart test
      - name: Test repository tools
        working-directory: tool
        run: dart test
      - name: Test app
        working-directory: app
        run: flutter test

  vulnerabilities:
    name: Known vulnerabilities (OSV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  test-server:
    name: Test mail server and integration tests
    runs-on: ubuntu-24.04
    env:
      FMAIL_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: >-
          shellcheck -x test-server/fmailtest test-server/smoke-test.sh
          test-server/certs/generate.sh test-server/image/entrypoint.sh
      - name: Start test servers
        run: test-server/fmailtest up
      - name: Smoke test
        run: test-server/fmailtest smoke
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: IMAP and SMTP integration tests
        working-directory: packages/mail_protocol
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Account setup integration tests
        working-directory: packages/mail_setup
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Sync engine integration tests (incl. multi-device convergence)
        working-directory: packages/mail_sync
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Server logs
        if: failure()
        run: |
          for mode in secure limited plain; do
            echo "::group::$mode"; test-server/fmailtest logs "$mode" || true; echo "::endgroup::"
          done

  build-linux:
    name: Build Linux (.deb, Flatpak)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev \
            libsecret-1-dev liblzma-dev libsqlcipher-dev flatpak shellcheck
      - name: Shellcheck packaging scripts
        run: shellcheck packaging/linux/build-deb.sh packaging/flatpak/build-flatpak.sh packaging/android/build-aab.sh
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build linux --release
      - name: Debian package
        run: packaging/linux/build-deb.sh
      - name: Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08
          packaging/flatpak/build-flatpak.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            build/packages/*.deb
            build/packages/*.flatpak
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      # Release signing key from repository secrets, written outside the
      # checkout and removed afterwards. Required for version tags; other
      # builds are signed with the debug key (fine for testing only).
      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.FMAIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FMAIL_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FMAIL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - working-directory: app
        env:
          FMAIL_KEYSTORE_PASSWORD: ${{ secrets.FMAIL_KEYSTORE_PASSWORD }}
          FMAIL_KEY_ALIAS: ${{ secrets.FMAIL_KEY_ALIAS }}
          FMAIL_KEY_PASSWORD: ${{ secrets.FMAIL_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Name the APK
        run: |
          version="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          mkdir -p build/packages
          cp app/build/app/outputs/flutter-apk/app-release.apk "build/packages/citusmail-$version.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: build/packages/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows (installer)
    needs: checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build windows --release
      - name: Installer (Inno Setup, unsigned)
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --no-progress -y
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version: *([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\citusmail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: build/packages/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, test-server, vulnerabilities, build-linux, build-android, build-windows]
    runs-on: ubuntu-24.04
    # The only job that may write: it creates the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" packages/*
          --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft
