name: CI

on:
  push:
    # On main, a new app version (app/pubspec.yaml) is released by itself:
    # see the checks job's "Release?" step. Pushing a version tag (v0.1.0)
    # by hand still works too.
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy, format, analyze, test
    runs-on: ubuntu-24.04
    outputs:
      # "true" when this run publishes a release, and its tag (v0.4.1).
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A version tag must be on a commit whose app version matches it
      # (v0.4.0 needs "version: 0.4.0+N"), so a tag made on an older commit
      # stops here instead of publishing a mislabelled release.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG is on a commit whose app version is $version (app/pubspec.yaml). Delete the tag and tag the commit that has version ${TAG#v}: git fetch origin && git tag -a $TAG -m \"Citusmail ${TAG#v}\" origin/main"
            exit 1
          fi
          echo "Tag $TAG matches app version $version"
      # A release when a version tag was pushed, or when main has an app
      # version that has no tag yet (the version was just bumped). The
      # release job then creates the tag on this commit.
      - name: Release?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)"
          release=false
          tag="v$version"
          if [[ "$REF" == refs/tags/v* ]]; then
            release=true
            tag="$REF_NAME"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag already exists: no release"
            else
              echo "App version $version has no tag yet: this run releases $tag"
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies (lock file must match)
        run: flutter pub get --enforce-lockfile
      - name: Dependency policy
        run: dart run repo_tools:check_dependencies
      - name: No network libraries in shipped code
        run: dart run repo_tools:check_imports
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Test mail_protocol
        working-directory: packages/mail_protocol
        run: dart test
      - name: Test mail_store
        working-directory: packages/mail_store
        run: dart test
      - name: Test mail_sync
        working-directory: packages/mail_sync
        run: dart test
      - name: Test mail_setup
        working-directory: packages/mail_setup
        run: dart test
      - name: Test mail_sort
        working-directory: packages/mail_sort
        run: dart test
      - name: Test mail_extract
        working-directory: packages/mail_extract
        run: dart test
      - name: Test mail_view
        working-directory: packages/mail_view
        run: dart test
      - name: Test mail_compose
        working-directory: packages/mail_compose
        run: dart test
      - name: Test mail_trust
        working-directory: packages/mail_trust
        run: dart test
      - name: Test mail_web
        working-directory: packages/mail_web
        run: dart test
      - name: Test mail_lookup
        working-directory: packages/mail_lookup
        run: dart test
      - name: Test mail_appsync
        working-directory: packages/mail_appsync
        run: dart test
      - name: Test mail_oauth
        working-directory: packages/mail_oauth
        run: dart test
      - name: Test mail_unsubscribe
        working-directory: packages/mail_unsubscribe
        run: dart test
      - name: Test background_clipboard
        working-directory: packages/background_clipboard
        run: flutter test
      - name: Test repository tools
        working-directory: tool
        run: dart test
      - name: Test app
        working-directory: app
        run: flutter test

  vulnerabilities:
    name: Known vulnerabilities (OSV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  site:
    name: Website (build and test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # Vercel deploys the site (see site/README.md); this only makes sure
      # a pull request doesn't break it.
      - name: Install (lock file must match)
        working-directory: site
        run: npm ci
      - name: Test
        working-directory: site
        env:
          SITE_OFFLINE: "1"
        run: npm test
      - name: Build
        working-directory: site
        env:
          SITE_OFFLINE: "1"
        run: npm run build

  test-server:
    name: Test mail server and integration tests
    runs-on: ubuntu-24.04
    env:
      CITUSMAIL_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: >-
          shellcheck -x test-server/citusmailtest test-server/smoke-test.sh
          test-server/certs/generate.sh test-server/image/entrypoint.sh
      - name: Start test servers
        run: test-server/citusmailtest up
      - name: Smoke test
        run: test-server/citusmailtest smoke
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: IMAP and SMTP integration tests
        working-directory: packages/mail_protocol
        env:
          CITUSMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Account setup integration tests
        working-directory: packages/mail_setup
        env:
          CITUSMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Sync engine integration tests (incl. multi-device convergence)
        working-directory: packages/mail_sync
        env:
          CITUSMAIL_INTEGRATION: "1"
        # One file at a time: they share the test accounts, and one file's
        # delivery must not land between another's two syncs.
        run: dart test test/integration --concurrency=1
      - name: Server logs
        if: failure()
        run: |
          for mode in secure limited plain; do
            echo "::group::$mode"; test-server/citusmailtest logs "$mode" || true; echo "::endgroup::"
          done

  build-linux:
    name: Build Linux (.deb, Flatpak)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # librsvg2-common: the SVG loader flatpak needs to accept the app's
      # SVG icon ("is not a valid icon: Format not recognized" without it).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev \
            libsecret-1-dev liblzma-dev libsqlcipher-dev flatpak shellcheck \
            librsvg2-common
      - name: Shellcheck packaging scripts
        run: >-
          shellcheck packaging/linux/build-deb.sh packaging/flatpak/build-flatpak.sh
          packaging/android/build-aab.sh packaging/android/check-play-bundle.sh
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
        run: >-
          flutter build linux --release
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$CITUSMAIL_SAFE_BROWSING_KEY"
      - name: Debian package
        run: packaging/linux/build-deb.sh
      - name: Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08
          packaging/flatpak/build-flatpak.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            build/packages/*.deb
            build/packages/*.flatpak
          if-no-files-found: error

  build-android:
    name: Build Android
    # Releases use build-android-release (signed with the release key).
    if: needs.checks.outputs.release != 'true'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      # Signed with the debug key: fine for testing, never for release.
      # Two flavors (packaging/README.md): the APK for GitHub ("github",
      # with Instant mail) and the bundle for Google Play ("play", without).
      - name: APK (github flavor)
        working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
        run: >-
          flutter build apk --release --flavor github
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$CITUSMAIL_SAFE_BROWSING_KEY"
      - name: App bundle for Google Play (play flavor)
        working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
        run: >-
          flutter build appbundle --release --flavor play
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$CITUSMAIL_SAFE_BROWSING_KEY"
      - name: Name the APK and the bundle
        run: |
          version="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          mkdir -p build/packages
          cp app/build/app/outputs/flutter-apk/app-github-release.apk "build/packages/citusmail-$version.apk"
          cp app/build/app/outputs/bundle/playRelease/app-play-release.aab "build/packages/citusmail-$version.aab"
      - name: The Play bundle has no Instant mail
        run: packaging/android/check-play-bundle.sh build/packages/*.aab
      - name: The GitHub APK keeps Instant mail
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml build/packages/*.apk > "$RUNNER_TEMP/manifest.txt"
          grep -F com.fluminaris.citusmail.InstantMailService "$RUNNER_TEMP/manifest.txt"
          grep -F android.permission.FOREGROUND_SERVICE_SPECIAL_USE "$RUNNER_TEMP/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: |
            build/packages/*.apk
            build/packages/*.aab
          if-no-files-found: error

  build-android-release:
    name: Build Android (release-signed)
    if: needs.checks.outputs.release == 'true'
    needs: checks
    runs-on: ubuntu-24.04
    # The signing secrets may be saved in the "release" environment
    # (Settings > Environments) or as repository secrets; this job sees both.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      # Release signing key from the secrets, written outside the checkout
      # and removed afterwards.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CITUSMAIL_KEYSTORE_BASE64 || secrets.FMAIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CITUSMAIL_KEYSTORE_BASE64 (or the older FMAIL_KEYSTORE_BASE64) is not set; refusing to publish a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CITUSMAIL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # The same key and the same build settings for both flavors
      # (packaging/README.md): the APK for GitHub ("github", with Instant
      # mail) and the bundle for Google Play ("play", without).
      - name: APK (github flavor)
        working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
          CITUSMAIL_KEYSTORE_PASSWORD: ${{ secrets.CITUSMAIL_KEYSTORE_PASSWORD || secrets.FMAIL_KEYSTORE_PASSWORD }}
          CITUSMAIL_KEY_ALIAS: ${{ secrets.CITUSMAIL_KEY_ALIAS || secrets.FMAIL_KEY_ALIAS }}
          CITUSMAIL_KEY_PASSWORD: ${{ secrets.CITUSMAIL_KEY_PASSWORD || secrets.FMAIL_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --flavor github
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$CITUSMAIL_SAFE_BROWSING_KEY"
      - name: App bundle for Google Play (play flavor)
        working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
          CITUSMAIL_KEYSTORE_PASSWORD: ${{ secrets.CITUSMAIL_KEYSTORE_PASSWORD || secrets.FMAIL_KEYSTORE_PASSWORD }}
          CITUSMAIL_KEY_ALIAS: ${{ secrets.CITUSMAIL_KEY_ALIAS || secrets.FMAIL_KEY_ALIAS }}
          CITUSMAIL_KEY_PASSWORD: ${{ secrets.CITUSMAIL_KEY_PASSWORD || secrets.FMAIL_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release --flavor play
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$CITUSMAIL_SAFE_BROWSING_KEY"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Name the APK and the bundle
        run: |
          version="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          mkdir -p build/packages
          cp app/build/app/outputs/flutter-apk/app-github-release.apk "build/packages/citusmail-$version.apk"
          cp app/build/app/outputs/bundle/playRelease/app-play-release.aab "build/packages/citusmail-$version.aab"
      - name: The Play bundle has no Instant mail
        run: packaging/android/check-play-bundle.sh build/packages/*.aab
      - name: The GitHub APK keeps Instant mail
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml build/packages/*.apk > "$RUNNER_TEMP/manifest.txt"
          grep -F com.fluminaris.citusmail.InstantMailService "$RUNNER_TEMP/manifest.txt"
          grep -F android.permission.FOREGROUND_SERVICE_SPECIAL_USE "$RUNNER_TEMP/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: |
            build/packages/*.apk
            build/packages/*.aab
          if-no-files-found: error

  build-windows:
    name: Build Windows (installer)
    needs: checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        env:
          # Public client IDs (repository variables) and keys (secrets). Empty
          # values leave the app asking users for their own (see
          # packaging/README.md).
          CITUSMAIL_MS_CLIENT_ID: ${{ vars.CITUSMAIL_MS_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_ID: ${{ vars.CITUSMAIL_GOOGLE_CLIENT_ID }}
          CITUSMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CITUSMAIL_GOOGLE_CLIENT_SECRET }}
          CITUSMAIL_SAFE_BROWSING_KEY: ${{ secrets.CITUSMAIL_SAFE_BROWSING_KEY }}
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define=CITUSMAIL_MS_CLIENT_ID="$env:CITUSMAIL_MS_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_ID="$env:CITUSMAIL_GOOGLE_CLIENT_ID"
          --dart-define=CITUSMAIL_GOOGLE_CLIENT_SECRET="$env:CITUSMAIL_GOOGLE_CLIENT_SECRET"
          --dart-define=CITUSMAIL_SAFE_BROWSING_KEY="$env:CITUSMAIL_SAFE_BROWSING_KEY"
      - name: Installer (Inno Setup, unsigned)
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --no-progress -y
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version: *([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\citusmail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: build/packages/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: needs.checks.outputs.release == 'true'
    needs: [checks, test-server, vulnerabilities, build-linux, build-android-release, build-windows]
    runs-on: ubuntu-24.04
    # The only job that may write: it creates the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS
      # Also creates the tag on this commit when it doesn't exist yet. A tag
      # made with this job's token starts no other run.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: >-
          gh release create "$TAG" packages/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Citusmail ${TAG#v}" --generate-notes
