name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy, format, analyze, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies (lock file must match)
        run: flutter pub get --enforce-lockfile
      - name: Dependency policy
        run: dart run repo_tools:check_dependencies
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Test mail_protocol
        working-directory: packages/mail_protocol
        run: dart test
      - name: Test mail_store
        working-directory: packages/mail_store
        run: dart test
      - name: Test mail_sync
        working-directory: packages/mail_sync
        run: dart test
      - name: Test mail_setup
        working-directory: packages/mail_setup
        run: dart test
      - name: Test mail_sort
        working-directory: packages/mail_sort
        run: dart test
      - name: Test mail_view
        working-directory: packages/mail_view
        run: dart test
      - name: Test mail_compose
        working-directory: packages/mail_compose
        run: dart test
      - name: Test repository tools
        working-directory: tool
        run: dart test
      - name: Test app
        working-directory: app
        run: flutter test

  vulnerabilities:
    name: Known vulnerabilities (OSV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

  test-server:
    name: Test mail server and integration tests
    runs-on: ubuntu-24.04
    env:
      FMAIL_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: >-
          shellcheck -x test-server/fmailtest test-server/smoke-test.sh
          test-server/certs/generate.sh test-server/image/entrypoint.sh
      - name: Start test servers
        run: test-server/fmailtest up
      - name: Smoke test
        run: test-server/fmailtest smoke
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: IMAP and SMTP integration tests
        working-directory: packages/mail_protocol
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Account setup integration tests
        working-directory: packages/mail_setup
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Sync engine integration tests (incl. multi-device convergence)
        working-directory: packages/mail_sync
        env:
          FMAIL_INTEGRATION: "1"
        run: dart test test/integration
      - name: Server logs
        if: failure()
        run: |
          for mode in secure limited plain; do
            echo "::group::$mode"; test-server/fmailtest logs "$mode" || true; echo "::endgroup::"
          done

  build-linux:
    name: Build Linux
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev \
            libsecret-1-dev liblzma-dev libsqlcipher-dev
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build linux --release

  build-android:
    name: Build Android
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build apk --release

  build-windows:
    name: Build Windows
    needs: checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build windows --release
