# Workspace root. All packages share one lock file (pubspec.lock), which is
# committed and checked by tool/check_dependencies.dart and the OSV scanner.
name: citusmail_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - app
  - packages/mail_appsync
  - packages/mail_compose
  - packages/mail_lookup
  - packages/mail_oauth
  - packages/mail_protocol
  - packages/mail_setup
  - packages/mail_sort
  - packages/mail_store
  - packages/mail_sync
  - packages/mail_trust
  - packages/mail_unsubscribe
  - packages/mail_view
  - packages/mail_web
  - tool

# Native SQLite for every package and the app: SQLite3MultipleCiphers, an
# encrypting SQLite build. package:sqlite3 downloads the prebuilt library
# for each platform and checks it against SHA-256 hashes pinned in the
# package. See packages/mail_store/README.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
