# limited: TLS required, but advertises an old-style capability list without
# CONDSTORE, QRESYNC or MOVE, to test the app's fallbacks.
ssl = required
disable_plaintext_auth = yes
imap_capability = IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE LITERAL+ NAMESPACE UIDPLUS SPECIAL-USE

# TLS: certificates come from the local test CA (test-server/certs).
# The hostname the client asks for (SNI) picks the certificate, so tests can
# get a broken certificate on purpose:
#   mail.fmail.test       valid (default)
#   expired.fmail.test    expired
#   untrusted.fmail.test  self-signed, not from the test CA
#   anything else         valid cert, but for the wrong hostname
ssl_cert = </etc/fmail-certs/mail.crt
ssl_key = </etc/fmail-certs/mail.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

local_name expired.fmail.test {
  ssl_cert = </etc/fmail-certs/expired.crt
  ssl_key = </etc/fmail-certs/expired.key
}
local_name untrusted.fmail.test {
  ssl_cert = </etc/fmail-certs/untrusted.crt
  ssl_key = </etc/fmail-certs/untrusted.key
}
