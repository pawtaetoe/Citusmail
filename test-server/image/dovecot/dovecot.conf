# Dovecot 2.3 configuration for the test server. NOT for real mail.
# Shared by all modes; mode.conf is linked at start-up by entrypoint.sh to
# mode-secure.conf, mode-limited.conf or mode-plain.conf.

protocols = imap lmtp sieve
listen = *
log_path = /dev/stderr
auth_verbose = yes

# --- Users ---------------------------------------------------------------
# alice, bob: hierarchy separator "/" (like Gmail and most servers).
# carol: cPanel style, "INBOX." prefix and "." separator (like Namecheap).
auth_mechanisms = plain login
auth_username_format = %Lu
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/mail/%d/%n
}

# --- Mail storage --------------------------------------------------------
mail_location = maildir:~/Maildir:LAYOUT=fs
mail_privileged_group = vmail
first_valid_uid = 5000
# Several app instances per user connect at once in sync tests.
mail_max_userip_connections = 50

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# --- Services ------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# ManageSieve (RFC 5804): the app stores its server rules here. STARTTLS
# is required like everywhere else (ssl = required in the TLS modes).
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# Postfix delivers incoming mail and checks SMTP logins through these.
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# Plus addressing: mail to alice+smoke@citusmail.test lands in alice's "smoke"
# folder (created on demand), so tests that send mail never change INBOX.
recipient_delimiter = +
lda_mailbox_autocreate = yes

# Each user's Sieve scripts; the active one runs on delivery.
plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@citusmail.test
  lmtp_save_to_detail_mailbox = yes
}

!include mode.conf
