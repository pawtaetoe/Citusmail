# Which fixture goes into which test mailbox, with which flags.
# Fixtures live in test-data/mail/. Read by test-server/seed.py.
#
# alice  main account, "/" separator, nested and non-ASCII folders
# bob    second account, for the unified inbox (shares a newsletter with alice)
# carol  cPanel/Namecheap style: "INBOX." prefix and "." separator

# ------------------------------------------------------------------ alice
