<?xml version="1.0" encoding="UTF-8"?>
<!-- Google Play feature graphic (1024×500): the app icon and the tagline on
     the lagoon gradient, in the app's colours (lagoon #0F7A69, citrus
     #F4B740) and font (IBM Plex Sans, app/assets/fonts). The PNG next to it
     is rendered from this file; see packaging/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14917C"/>
      <stop offset="1" stop-color="#0B4A40"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18A58D"/>
      <stop offset="1" stop-color="#0D5A4E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04211C" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Faint citrus speed lines in the background. -->
  <g stroke="#F4B740" stroke-linecap="round" opacity="0.12" stroke-width="18">
    <line x1="700" y1="70" x2="980" y2="70"/>
    <line x1="780" y1="430" x2="1000" y2="430"/>
    <line x1="40" y1="455" x2="200" y2="455"/>
  </g>
  <!-- The app icon (assets/icon/icon.svg), 300 px, centred vertically. -->
  <g transform="translate(70 100) scale(0.5859)" filter="url(#shadow)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
    <g transform="matrix(1 0 -0.2493 1 96 0)">
      <rect x="150" y="160" width="252" height="184" rx="26" fill="#FFFFFF"/>
      <path d="M166 180 L276 262 L386 180" fill="none" stroke="#0F7A69" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#F4B740" stroke-width="22" stroke-linecap="round">
      <line x1="104" y1="206" x2="168" y2="206"/>
      <line x1="84" y1="252" x2="160" y2="252"/>
      <line x1="104" y1="298" x2="148" y2="298"/>
    </g>
  </g>
  <g font-family="'IBM Plex Sans', 'IBMPlexSans', sans-serif">
    <text x="430" y="210" font-size="88" font-weight="600" fill="#FFFFFF">Citusmail</text>
    <rect x="434" y="240" width="72" height="8" rx="4" fill="#F4B740"/>
    <text x="430" y="312" font-size="40" font-weight="400" fill="#E3F3EF">Fast, private email</text>
    <text x="430" y="362" font-size="40" font-weight="400" fill="#E3F3EF">that stays yours</text>
  </g>
</svg>
